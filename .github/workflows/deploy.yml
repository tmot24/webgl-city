name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build -w @webgl-city/angular -- --configuration production --base-href /webgl-city/angular/

      - name: Build React
        run: npm run build -w @webgl-city/react -- --base /webgl-city/react/

      - name: Assemble site
        run: |
          mkdir -p site
          # стартовая страница: выбор версии; она же 404 - неверный адрес ведёт к выбору
          cp pages/index.html site/index.html
          cp pages/index.html site/404.html
          cp apps/angular/public/webgl.ico site/
          cp -r apps/angular/dist/webgl-city/browser site/angular
          cp -r apps/react/dist site/react

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
