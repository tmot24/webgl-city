<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebGL2 City</title>
  <link rel="icon" type="image/x-icon" href="/webgl-city/webgl.ico" />
  <style>
    :root {
      --sky: rgb(135, 179, 222);
      --panel: rgba(0, 0, 0, 0.6);
      --text: #fff;
      --accent: #ffd24d;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--sky);
      color: var(--text);
    }

    main {
      width: min(100%, 520px);
      padding: 24px;
      border-radius: 8px;
      background: var(--panel);
      line-height: 1.4;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
    }

    p {
      margin: 0 0 20px;
      opacity: 0.9;
    }

    nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    a {
      display: block;
      padding: 14px 16px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.12);
      color: var(--text);
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      background: rgba(255, 255, 255, 0.2);
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    a b {
      display: block;
      font-size: 1.125rem;
    }

    a span {
      font-size: 0.875rem;
      opacity: 0.8;
    }

    @media (max-width: 420px) {
      nav {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
<main>
  <h1>WebGL2 City</h1>
  <p>
    Процедурный 3D-город на чистом WebGL2: тени, выбор зданий, измерения, маршруты A*. Одно ядро — два
    приложения.
  </p>
  <nav>
    <a href="/webgl-city/angular/">
      <b>Angular</b>
      <span>сигналы, @ngrx/signals</span>
    </a>
    <a href="/webgl-city/react/">
      <b>React</b>
      <span>MobX</span>
    </a>
  </nav>
</main>
</body>
</html>
