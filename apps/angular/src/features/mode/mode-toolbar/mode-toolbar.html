<div class="mode-toolbar">
  @for (option of modes; track option.id) {
    <button
      type="button"
      class="mode-toolbar__tab"
      [class.mode-toolbar__tab_active]="option.id === store.mode()"
      (click)="store.setMode({ mode: option.id })"
    >
      {{ option.label }}
    </button>
  }
</div>
